[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cartoon2d"
version = "0.3.0"
description = "Draw and animate simple 2D cartoons with one-line calls like DrawCar('red', 10, 5)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["matplotlib", "numpy", "pillow"]

[tool.setuptools]
packages = ["cartoon2d"]
